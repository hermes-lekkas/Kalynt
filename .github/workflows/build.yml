name: Build Installers

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_OPTIONS: '--max-old-space-size=4096'

jobs:
  build-windows:
    # windows-latest now ships Visual Studio 2026, which node-gyp 11 can't detect
    # (it knows 2019 and 2022), so native modules fail to rebuild there.
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Python (native modules)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Test AI connections and command handling
        run: npm test --workspace=apps/desktop

      - name: Rebuild native modules
        working-directory: apps/desktop
        env:
          CXXFLAGS: '-std=c++20'
          npm_config_cxx: '-std=c++20'
        run: npm run rebuild:native

      - name: Build & Package (Windows)
        working-directory: apps/desktop
        env:
          NODE_ENV: production
          OBFUSCATE: 'false'
        run: |
          npx tsc
          npx tsc -p tsconfig.node.json
          npx vite build
          npx electron-builder --win --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.exe.blockmap
            apps/desktop/release/latest.yml
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Python (native modules)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Test AI connections and command handling
        run: npm test --workspace=apps/desktop

      - name: Rebuild native modules
        working-directory: apps/desktop
        env:
          CXXFLAGS: '-std=c++20'
          npm_config_cxx: '-std=c++20'
        run: npm run rebuild:native

      - name: Build Swift Native Helper
        working-directory: packages/native-macos
        run: swift build -c release

      - name: Build & Package (macOS)
        working-directory: apps/desktop
        env:
          NODE_ENV: production
          OBFUSCATE: 'false'
        run: |
          npx tsc
          npx tsc -p tsconfig.node.json
          npx vite build
          npx electron-builder --mac --publish never

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.dmg.blockmap
            apps/desktop/release/*.zip
            apps/desktop/release/*.zip.blockmap
            apps/desktop/release/latest-mac.yml
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Python (native modules)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Test AI connections and command handling
        run: npm test --workspace=apps/desktop

      - name: Rebuild native modules
        working-directory: apps/desktop
        env:
          CXXFLAGS: '-std=c++20'
          npm_config_cxx: '-std=c++20'
        run: npm run rebuild:native

      - name: Build & Package (Linux)
        working-directory: apps/desktop
        env:
          NODE_ENV: production
          OBFUSCATE: 'false'
        run: |
          npx tsc
          npx tsc -p tsconfig.node.json
          npx vite build
          npx electron-builder --linux --publish never

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/latest-linux.yml
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
