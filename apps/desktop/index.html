<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'sha256-yG0xOLIBw05HmE6wX15JJN5KmJSiaESVia0KMsgiXrs=' 'unsafe-eval' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' ws://localhost:4444 wss: https:; img-src 'self' data: blob: https:; object-src 'none'; base-uri 'self';" />
    <meta name="description" content="Kalynt - Serverless P2P Team Collaboration Platform" />
    <title>Kalynt</title>
    <link rel="icon" type="image/x-icon" sizes="16x16" href="/Kalynt_16x16.ico">
    <link rel="icon" type="image/x-icon" sizes="32x32" href="/Kalynt_32x32.ico">
    <link rel="icon" type="image/x-icon" sizes="48x48" href="/Kalynt_48x48.ico">
    <link rel="icon" type="image/x-icon" sizes="256x256" href="/Kalynt_256x256.ico">
    <script>(function(){try{var raw=localStorage.getItem('kalynt-app');var t=raw?JSON.parse(raw).state&&JSON.parse(raw).state.theme:'dark';var r=t==='light'?'light':t==='system'?(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):'dark';document.documentElement.dataset.theme=r;}catch(e){document.documentElement.dataset.theme='dark';}})();</script>
    <style>
        html,
        body {
            background: #17161d;
            margin: 0;
        }

        html[data-theme='light'],
        html[data-theme='light'] body {
            background: #f6f5f9;
        }

        .init-loader {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 32px;
            height: 32px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 2px solid rgba(240, 238, 246, 0.12);
            border-top-color: rgba(164, 141, 255, 0.72);
            animation: init-spin 0.8s linear infinite;
        }

        html[data-theme='light'] .init-loader {
            border-color: rgba(25, 24, 33, 0.12);
            border-top-color: rgba(106, 75, 232, 0.72);
        }

        @keyframes init-spin {
            to {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div id="root">
        <div class="init-loader" aria-hidden="true"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
